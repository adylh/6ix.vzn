<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Production Team Register</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/Church_register/styles.css" />
</head>
<body>
  <main class="register-page">
    <div class="container py-4 py-md-5">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-11 col-md-9 col-lg-7 col-xl-6">
          <div class="register-card">
            <div class="text-center mb-4">
              <span class="badge custom-badge mb-3">Church Production Team</span>
              <h1 class="register-title">Production Team Register</h1>
              <p class="register-subtitle mb-0">
                Please submit your register when you arrive. Leave notes blank unless
                you are late or need to mention something important.
              </p>
            </div>

            <div id="alertBox"></div>

            <form id="registerForm" novalidate>
              <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <select class="form-select custom-input" id="fullName" required>
                  <option value="">Select your name</option>
                  <option value="Ady Leo-Harding">Ady Leo-Harding</option>
                  <option value="John Smith">John Smith</option>
                  <option value="Sarah Doe">Sarah Doe</option>
                  <option value="Michael Lee">Michael Lee</option>
                  <option value="Daniel Brown">Daniel Brown</option>
                </select>
                <div class="invalid-feedback">Please select your name.</div>
              </div>

              <div class="mb-3">
                <label for="team" class="form-label">Team</label>
                <select class="form-select custom-input" id="team" required>
                  <option value="">Select team</option>
                  <option value="Media">Media</option>
                  <option value="Sound Engineering">Sound Engineering</option>
                </select>
                <div class="invalid-feedback">Please select a team.</div>
              </div>

              <div class="mb-3">
                <label for="serviceDay" class="form-label">Service / Event Day</label>
                <select class="form-select custom-input" id="serviceDay" required>
                  <option value="">Select day</option>
                  <option value="Monday">Monday</option>
                  <option value="Tuesday">Tuesday</option>
                  <option value="Wednesday">Wednesday</option>
                  <option value="Thursday">Thursday</option>
                  <option value="Friday">Friday</option>
                  <option value="Saturday">Saturday</option>
                  <option value="Sunday">Sunday</option>
                </select>
                <div class="invalid-feedback">Please select a day.</div>
              </div>

              <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <select class="form-select custom-input" id="role" required>
                  <option value="">Select role</option>
                  <option value="Sound">Sound</option>
                  <option value="Camera">Camera</option>
                  <option value="Lyrics">Lyrics</option>
                  <option value="Visuals">Visuals</option>
                </select>
                <div class="invalid-feedback">Please select a role.</div>
              </div>

              <div class="mb-4">
                <label for="notes" class="form-label">Notes</label>
                <textarea
                  class="form-control custom-input custom-textarea"
                  id="notes"
                  rows="4"
                  placeholder="Only fill this if you are late or need to mention something"
                ></textarea>
              </div>

              <button type="submit" id="submitBtn" class="btn submit-btn w-100">
                <span class="btn-text">Submit Register</span>
                <span
                  class="spinner-border spinner-border-sm ms-2 d-none"
                  id="submitSpinner"
                  aria-hidden="true"
                ></span>
              </button>
            </form>
          </div>

          <p class="footer-note text-center mt-3 mb-0">
            Built for quick mobile check-in.
          </p>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/Church_register/app.js"></script>
</body>
</html>

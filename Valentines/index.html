<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Happy Birthday — A Celebration of You</title>
<meta name="description" content="A magical birthday tribute filled with memories, love, and wishes." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet" />

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link rel="stylesheet" href="/Valentines/style.css" />
</head>
<body>

<!-- HERO -->
<section class="hero d-flex align-items-center justify-content-center text-center px-3">
  <div class="hero-bg"></div>
  <i class="bi bi-stars float-icon icon-1"></i>
  <i class="bi bi-heart-fill float-icon icon-2"></i>
  <i class="bi bi-gift-fill float-icon icon-3"></i>
  <i class="bi bi-balloon-heart-fill float-icon icon-4"></i>

  <div class="container position-relative" style="max-width: 900px;">
    <p class="font-script accent shimmer fs-3 mb-2">It's your special day</p>
    <h1 class="display-1 fw-bold lh-1 mb-3">
      <span class="text-gradient">Happy</span><br />
      <span class="font-script fst-italic text-white" style="font-size: 1.1em;">Birthday</span>
    </h1>
    <input type="text" id="name" value="Chiddy"
      class="form-control bg-transparent border-0 text-center font-script accent fs-1 editable-name" />
    <p class="mt-4 text-white-75 fs-5 mx-auto" style="max-width: 640px;">
      A little corner of the internet built just for you — to celebrate every smile, every memory, every dream.
    </p>
    <a href="#message" class="btn btn-glow mt-4 px-4 py-2">
      <i class="bi bi-arrow-down-circle me-2"></i> Open my gift
    </a>
  </div>
</section>

<!-- HERO PORTRAIT -->
<section class="py-5 px-3">
  <div class="container" style="max-width: 720px;">
    <div class="upload-card hero-portrait shadow-glow d-flex flex-column align-items-center justify-content-center">
      <img id="hero-preview" src="/Valentines/images/IMG_0686.jpg" alt="The birthday star" />
    </div>
  </div>
</section>

<!-- MESSAGE -->
<section id="message" class="py-5 px-3">
  <div class="container text-center" style="max-width: 760px;">
    <i class="bi bi-heart-fill display-5 text-pink shimmer mb-3"></i>
    <h2 class="font-script text-gradient display-3 mb-4">A Message For You</h2>
    <div class="glass rounded-4 p-4 p-md-5 shadow-soft">
      <textarea id="message-text" rows="7" class="form-control bg-transparent border-0 text-center text-white fs-5 message-area">Today we celebrate the most wonderful soul. May your year be filled with laughter, dreams come true, and endless love. You shine brighter than every star in the sky. ✨</textarea>
      <hr class="border-light opacity-25 my-4" />
      <input type="text" id="signature" value="With all my love"
        class="form-control bg-transparent border-0 text-center font-script accent fs-2" />
    </div>
  </div>
</section>

<!-- MEMORIES -->
<section class="py-5 px-3">
  <div class="container" style="max-width: 1100px;">
    <div class="text-center mb-5">
      <p class="font-script accent fs-4 mb-1">moments to remember</p>
      <h2 class="display-3 fw-bold text-gradient">Our Memories</h2>
    </div>
    <div class="row g-4" id="memories-grid">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="upload-card memory-card shadow-soft">
          <img src="/Valentines/images/memory-1.jpg" alt="Memory 1" />
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="upload-card memory-card shadow-soft">
          <img src="/Valentines/images/memory-2.jpg" alt="Memory 2" />
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="upload-card memory-card shadow-soft">
          <img src="/Valentines/images/memory-3.jpg" alt="Memory 3" />
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="upload-card memory-card shadow-soft">
          <img src="/Valentines/images/memory-4.jpg" alt="Memory 4" />
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="upload-card memory-card shadow-soft">
          <img src="/Valentines/images/memory-5.jpg" alt="Memory 5" />
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="upload-card memory-card shadow-soft">
          <img src="/Valentines/images/memory-6.jpg" alt="Memory 6" />
        </div>
      </div>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="text-center py-5 px-3">
  <i class="bi bi-stars fs-2 accent shimmer"></i>
  <p class="font-script fs-3 text-gradient mt-2 mb-1">Wishing you a year as wonderful as you are</p>
  <p class="small text-white-50">Made with love 💕</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
